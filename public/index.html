<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitor de Mobilidade Urbana em Tempo Real</title>
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0e1117; color: #f0f2f6; }
    
    header { background-color: #16213e; padding: 20px; border-bottom: 1px solid #1e2130; display: flex; justify-content: space-between; align-items: center; }
    header h1 { font-size: 1.5rem; color: #00b4d8; }
    .status-badge { background: #0096FF22; color: #00b4d8; border: 1px solid #00b4d8; padding: 4px 12px; border-radius: 20px; font-size: 0.85rem; }

    .container { max-width: 1400px; margin: 20px auto; padding: 0 20px; display: flex; flex-direction: column; gap: 20px; }
    
    .metrics-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; }
    .card { background-color: #16213e; border: 1px solid #1e2130; border-radius: 10px; padding: 20px; }
    .card h3 { font-size: 0.9rem; color: #8b949e; margin-bottom: 8px; }
    .card .value { font-size: 2.2rem; font-weight: bold; color: #00b4d8; }

    .content-grid { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }

    #map { width: 100%; height: 500px; border-radius: 10px; border: 1px solid #1e2130; }

    .incidents-card { background-color: #16213e; border: 1px solid #1e2130; border-radius: 10px; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    .incidents-card h2 { font-size: 1.1rem; color: #00b4d8; border-bottom: 1px solid #1e2130; padding-bottom: 10px; }
    .incident-item { background: #0e1117; padding: 12px; border-radius: 6px; border-left: 4px solid #00b4d8; font-size: 0.88rem; }
    .incident-item.ALTO { border-left-color: #ff4b4b; }
    .incident-item.MÉDIO { border-left-color: #ffa726; }
    .incident-item.BAIXO { border-left-color: #26a69a; }
    .incident-item .title { font-weight: bold; margin-bottom: 4px; color: #fff; }
    .incident-item .meta { color: #8b949e; font-size: 0.8rem; }

    @media (max-width: 900px) {
      .metrics-grid { grid-template-columns: 1fr; }
      .content-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <header>
    <h1>Monitor de Mobilidade & Trânsito Urbano</h1>
    <div class="status-badge" id="live-status">Conectando...</div>
  </header>

  <div class="container">
    <div class="metrics-grid">
      <div class="card">
        <h3>Semáforos Mapeados</h3>
        <div class="value" id="val-semaforos">--</div>
      </div>
      <div class="card">
        <h3>Vias Monitoradas</h3>
        <div class="value" id="val-vias">--</div>
      </div>
      <div class="card">
        <h3>Incidentes Ativos</h3>
        <div class="value" id="val-incidentes">--</div>
      </div>
    </div>

    <div class="content-grid">
      <div class="card" style="padding: 0; overflow: hidden;">
        <div id="map"></div>
      </div>

      <div class="incidents-card">
        <h2>Ocorrências em Tempo Real</h2>
        <div id="incidents-list" style="display: flex; flex-direction: column; gap: 10px; overflow-y: auto; max-height: 430px;">
          <div style="color: #8b949e;">Carregando incidentes...</div>
        </div>
      </div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    let map;
    let markersGroup;

    function initMap() {
      map = L.map('map').setView([-23.5505, -46.6333], 13);
      
      // Esri World Dark Gray (Sem API Key)
      L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
        attribution: 'Tiles &copy; Esri &mdash; Esri, DeLorme, NAVTEQ',
        maxZoom: 16
      }).addTo(map);

      markersGroup = L.layerGroup().addTo(map);
    }

    async function loadLiveData() {
      try {
        const res = await fetch('/api/index');
        const PAYLOAD = await res.json();

        // Atualiza KPIs
        document.getElementById('val-semaforos').innerText = PAYLOAD.summary?.totalSemaforosMapeados || 0;
        document.getElementById('val-vias').innerText = PAYLOAD.summary?.totalViasPrincipais || 0;
        document.getElementById('val-incidentes').innerText = PAYLOAD.summary?.totalIncidentesAtivos || 0;
        document.getElementById('live-status').innerText = '● Ao Vivo (Overpass API)';

        // Renderiza Lista de Incidentes
        const incidentsContainer = document.getElementById('incidents-list');
        incidentsContainer.innerHTML = '';
        if (PAYLOAD.incidentes && PAYLOAD.incidentes.length > 0) {
          PAYLOAD.incidentes.forEach(inc => {
            const item = document.createElement('div');
            item.className = `incident-item ${inc.impacto}`;
            item.innerHTML = `
              <div class="title">${inc.tipo}</div>
              <div>${inc.local}</div>
              <div class="meta">Impacto: ${inc.impacto} | Status: ${inc.status}</div>
            `;
            incidentsContainer.appendChild(item);
          });
        } else {
          incidentsContainer.innerHTML = '<div style="color: #8b949e;">Nenhum incidente ativo.</div>';
        }

        // Plotar Pontos dos Semáforos no Mapa
        markersGroup.clearLayers();
        if (PAYLOAD.nodes && PAYLOAD.nodes.length > 0) {
          PAYLOAD.nodes.forEach(node => {
            if (node.lat && node.lon) {
              L.circleMarker([node.lat, node.lon], {
                radius: 5,
                fillColor: "#00b4d8",
                color: "#ffffff",
                weight: 1,
                opacity: 1,
                fillOpacity: 0.85
              }).bindPopup(`<b>Semáforo ID:</b> ${node.id}`).addTo(markersGroup);
            }
          });
        }
      } catch (err) {
        document.getElementById('live-status').innerText = '❌ Erro de Conexão';
        console.error("Erro ao carregar dados:", err);
      }
    }

    window.onload = () => {
      initMap();
      loadLiveData();
      setInterval(loadLiveData, 60000);
    };
  </script>
</body>
</html>
